name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Desktop Calligraphy ${{ github.ref_name }}"
          releaseBody: |
            自动构建的 macOS 安装包（同时支持 Apple Silicon 与 Intel）。

            下载 .dmg 后拖入「应用程序」即可。首次打开因为没有 Apple 开发者签名，
            系统会提示"来自身份不明的开发者"——在「访达」里右键该 App，选择"打开"，
            再在弹窗里确认一次即可，以后就能正常双击启动。
          releaseDraft: true
          args: --target universal-apple-darwin
